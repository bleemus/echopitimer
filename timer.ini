[MQTTSettings]
# MQTT broker hostname or IP address (default: localhost)
broker_host = localhost

# MQTT broker port (default: 1883)
broker_port = 1883

# MQTT topic to subscribe to for timer events (default: echopitimer/timer)
topic = echopitimer/timer

# Optional: MQTT username for authentication (leave empty if not required)
# username = your_mqtt_username

# Optional: MQTT password for authentication (leave empty if not required)
# password = your_mqtt_password
